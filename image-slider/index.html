<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>

    <div class="big">
        <img id="bigImage" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Main image">

    <div class="row">
        <img class="thumb" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Image 1">

        <img class="thumb" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Image 2">

        <img class="thumb" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=800" alt="Image 3">

        <img class="thumb" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Image 4">
    </div>

    <script src="./main.js"></script>
</body>
</html>
